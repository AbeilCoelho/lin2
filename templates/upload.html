{% extends 'base.html' %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- LEFT: Project Selection/Creation -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200 h-fit">
        <div class="bg-gray-800 px-6 py-4 border-b border-gray-700">
            <h2 class="text-xl font-bold text-white">Project Workspace</h2>
            <p class="text-gray-300 text-sm mt-1">Select an active project or create a new one.</p>
        </div>
        <div class="p-6">
            <form action="/set_project" method="POST" class="flex items-end gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Create New Project</label>
                    <input type="text" name="project_name" placeholder="e.g., FFIEC-002-Old-Lineage" class="w-full border rounded p-2 focus:ring-rbcBlue border-gray-300" required>
                </div>
                <button type="submit" class="bg-gray-800 text-white font-bold py-2 px-6 rounded shadow hover:bg-black transition">Create</button>
            </form>

            <div class="mt-8 border-t pt-6">
                <label class="block text-sm font-bold text-gray-700 mb-3">Or Resume Existing Project:</label>
                <div class="space-y-2 max-h-48 overflow-y-auto pr-2">
                    {% for p in projects %}
                        <form action="/set_project" method="POST">
                            <input type="hidden" name="project_name" value="{{ p }}">
                            <button type="submit" class="w-full text-left px-4 py-3 rounded border {% if p == active_project %} bg-blue-50 border-rbcBlue font-bold text-rbcBlue shadow-sm {% else %} bg-white border-gray-200 text-gray-600 hover:bg-gray-50 hover:border-gray-300 {% endif %} transition flex justify-between">
                                <span>📁 {{ p }}</span>
                                {% if p == active_project %}<span class="text-xs">Active</span>{% endif %}
                            </button>
                        </form>
                    {% else %}
                        <p class="text-sm text-gray-500 italic">No existing projects found.</p>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT: Data Upload (Only if Project Active) -->
    <div class="bg-white rounded-lg shadow-lg overflow-hidden border border-gray-200 {% if not active_project %} opacity-50 pointer-events-none {% endif %}">
        <div class="bg-rbcBlue px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-bold text-white">Initialize Data Files</h2>
            <p class="text-blue-200 text-sm mt-1">Upload reports to your active project.</p>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" class="px-6 py-6 space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">1. Target CDE List (reporting_layers.xlsx)</label>
                <input type="file" name="target_cde_file" required accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-rbcBlue hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-1">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">2. Primary Report Lineage (Optional)</label>
                <input type="file" name="primary_lineage_file" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-rbcBlue hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-1">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">3. Global Lineage Repository (Optional)</label>
                <input type="file" name="global_lineage_file" accept=".xlsx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-rbcBlue hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-1">
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-200">
                <button type="submit" class="bg-rbcBlue text-white font-bold py-2 px-6 rounded shadow hover:bg-rbcBlueDark transition duration-150">
                    Load Data & Open Dashboard
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
